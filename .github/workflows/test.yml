name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token, and no secrets: the workflow uploads nothing. Every job runs
# on a GitHub-hosted runner, so a pull request from a fork runs in a fresh
# virtual machine and never on a machine of ours.
permissions:
  contents: read

jobs:
  test:
    # Linux is where most CI and container users run the CLI; macOS is where
    # most of the people who asked for it work. Symlink handling differs between
    # the two, which is the one behaviour worth running on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The built CLI must start and refuse a manifest that would escape the
      # store; both are cheap to check on every platform.
      - name: Smoke test the built CLI
        run: bash scripts/smoke.sh
